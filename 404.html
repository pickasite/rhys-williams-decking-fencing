
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Moved | Redirecting to Homepage...</title>
    
    <!-- Meta Refresh: Fallback header redirect for standard web browsers -->
    <meta http-equiv="refresh" content="3; url=/">
    <link rel="canonical" href="/">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f17;
            color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .redirect-card {
            background-color: #111827;
            border: 1px solid #1f293d;
            border-radius: 1rem;
            padding: 2.5rem 2rem;
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3.5px solid rgba(20, 184, 166, 0.2);
            border-top-color: #14b8a6;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            margin: 0 auto 1.5rem auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }
        p {
            font-size: 0.9rem;
            color: #9ca3af;
            line-height: 1.5;
            margin-bottom: 1.25rem;
        }
        .btn-home {
            display: inline-block;
            background-color: #14b8a6;
            color: #0b0f17;
            font-weight: 600;
            font-size: 0.875rem;
            padding: 0.65rem 1.25rem;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn-home:hover {
            background-color: #0d9488;
            color: #ffffff;
        }
    </style>

    <script>
        // Redirect safely while handling sandboxed/blob preview environments gracefully
        (function() {
            try {
                // Execute redirect only when hosted on real HTTP or HTTPS origins
                var protocol = window.location.protocol;
                if (protocol === 'http:' || protocol === 'https:') {
                    var targetUrl = window.location.origin + '/';
                    window.location.replace(targetUrl);
                } else {
                    console.info('Preview mode detected (blob/file scheme). Automatic redirect paused for testing.');
                }
            } catch (err) {
                console.warn('Redirect execution prevented:', err);
            }
        })();
    </script>
</head>
<body>
    <div class="redirect-card">
        <div class="spinner"></div>
        <h1>Page Moved or Deleted</h1>
        <p>The page you requested is no longer available. Redirecting you to the home page now...</p>
        <a href="/" class="btn-home">Return to Main Site Immediately</a>
    </div>
</body>
</html>
